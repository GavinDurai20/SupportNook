name: SupportNook CI

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
frontend:
name: Frontend CI
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: client

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: client/package-lock.json

  - name: Install frontend dependencies
    run: npm ci

  - name: Run frontend lint
    run: npm run lint

  - name: Build frontend
    run: npm run build
```

backend:
name: Backend CI
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: server

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: server/package-lock.json

  - name: Install backend dependencies
    run: npm ci

  - name: Check backend
    run: npm run check
```

docker:
name: Docker Build
runs-on: ubuntu-latest
needs:
- frontend
- backend

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build backend Docker image
    run: docker build -t supportnook-server ./server

  - name: Build frontend Docker image
    run: docker build -t supportnook-client ./client
```
