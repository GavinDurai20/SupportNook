services:

  frontend:
    build:
      context: ./client
    container_name: supportnook-client
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    container_name: supportnook-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/supportnook
      FRONTEND_URL: http://localhost:5173
      JUDGE0_URL: https://ce.judge0.com
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: supportnook-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: