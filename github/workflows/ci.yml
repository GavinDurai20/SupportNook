name: SupportNook CI

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
frontend:
name: Frontend CI
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: client

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: client/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run lint
    run: npm run lint

  - name: Build frontend
    run: npm run build
```

backend:
name: Backend CI
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: server

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: server/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Check JavaScript syntax
    run: node --check src/server.js
```

docker:
name: Docker Build
runs-on: ubuntu-latest

```
needs:
  - frontend
  - backend

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Build backend image
    run: docker build -t supportnook-server ./server

  - name: Build frontend image
    run: docker build -t supportnook-client ./client
```
